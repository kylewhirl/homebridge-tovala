name: Homebridge Plugin Test

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  homebridge-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build plugin
        run: npm run build

      - name: Install Homebridge globally
        run: npm install -g homebridge@2.0.0-beta.0

      - name: Run Homebridge and check plugin load
        run: |
          mkdir -p ~/.homebridge
          echo '{}' > ~/.homebridge/config.json
          
          # Run homebridge in the background and redirect output
          homebridge --plugin-path . --no-qrcode --debug > hb_output.log 2>&1 &
          HB_PID=$!
          
          echo "Homebridge PID: $HB_PID"

          # Give it a few seconds to start
          sleep 10

          # Check output log for plugin load confirmation
          if grep -q "Loaded plugin: homebridge-tovala" hb_output.log; then
            echo "Plugin loaded successfully."
          else
            echo "Plugin failed to load."
            cat hb_output.log
            kill $HB_PID
            exit 1
          fi

          # Kill homebridge after check
          kill $HB_PID
